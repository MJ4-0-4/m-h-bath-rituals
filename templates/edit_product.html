<!DOCTYPE html>
<html>
<head>
    <title>Edit Product - M&H Bath Rituals</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" as="style" onload="this.rel='stylesheet'" href="https://fonts.googleapis.com/css2?display=swap&family=Epilogue%3Awght%40400%3B500%3B700%3B900&family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" />
</head>
<body class="bg-gray-50" style='font-family: Epilogue, "Noto Sans", sans-serif;'>
    <div class="container mx-auto p-4 md:p-8">
        <div class="max-w-2xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-[#181411]">Edit Product</h1>
                <a href="{{ url_for('admin') }}" class="text-sm text-blue-600 hover:underline">← Back to Admin</a>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <form action="{{ url_for('edit_product', product_id=product.id) }}" method="POST" enctype="multipart/form-data" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700">Product Name</label>
                            <input type="text" name="name" id="name" value="{{ product.name }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="category_id" class="block text-sm font-medium text-gray-700">Category</label>
                            <select name="category_id" id="category_id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                                {% for category in categories %}
                                <option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div>
                        <label for="description" class="block text-sm font-medium text-gray-700">Short Description</label>
                        <input type="text" name="description" id="description" value="{{ product.description }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                    </div>
                    <div>
                        <label for="image" class="block text-sm font-medium text-gray-700">Upload New Image (Optional)</label>
                        <input type="file" name="image" id="image" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                        <p class="text-xs text-gray-500 mt-1">Current Image: <a href="{{ url_for('static', filename=product.image) }}" target="_blank" class="text-blue-500">{{ product.image.split('/')[-1] }}</a></p>
                    </div>
                    <div>
                        <label for="ingredients" class="block text-sm font-medium text-gray-700">Ingredients</label>
                        <textarea name="ingredients" id="ingredients" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">{{ product.ingredients or '' }}</textarea>
                    </div>
                    <div>
                        <label for="how_to_use" class="block text-sm font-medium text-gray-700">How to Use</label>
                        <textarea name="how_to_use" id="how_to_use" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">{{ product.how_to_use or '' }}</textarea>
                    </div>
                    
                    <h3 class="text-lg font-medium text-gray-900 pt-4 border-t">Product Variants (Sizes & Prices)</h3>
                    <div id="variants-container" class="space-y-2">
                        {% for variant in product.variants %}
                        <div class="flex items-center gap-2 variant-row">
                            <input type="text" name="size[]" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" placeholder="Size (e.g., 100g)" value="{{ variant.size }}" required>
                            <input type="number" name="price[]" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" placeholder="Price (PKR)" value="{{ variant.price }}" required>
                            <button type="button" class="text-red-500 remove-variant-btn {{ 'hidden' if loop.first }} text-2xl font-bold">&times;</button>
                        </div>
                        {% else %}
                        <div class="flex items-center gap-2 variant-row">
                            <input type="text" name="size[]" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" placeholder="Size (e.g., 100g)" required>
                            <input type="number" name="price[]" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" placeholder="Price (PKR)" required>
                            <button type="button" class="text-red-500 remove-variant-btn hidden text-2xl font-bold">&times;</button>
                        </div>
                        {% endfor %}
                    </div>
                    <button type="button" id="add-variant-btn" class="mt-2 text-sm text-indigo-600 hover:text-indigo-800 font-semibold">+ Add another size</button>

                    <div>
                        <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">Update Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('add-variant-btn').addEventListener('click', function() {
            const container = document.getElementById('variants-container');
            const newRow = container.querySelector('.variant-row').cloneNode(true);
            newRow.querySelectorAll('input').forEach(input => input.value = '');
            newRow.querySelector('.remove-variant-btn').classList.remove('hidden');
            container.appendChild(newRow);
        });
        document.getElementById('variants-container').addEventListener('click', function(e) {
            if (e.target.classList.contains('remove-variant-btn')) {
                e.target.closest('.variant-row').remove();
            }
        });
    </script>
</body>
</html>
